title = "My PvP Wishlist"
description = "PvP god rolls"

# One [[roll]] per roll you want. perks = [barrels, mags, trait 1, trait 2].
# Any listed perk in a column is OK. Use [] for "don't care" (trailing columns can be omitted).
# Names are case-insensitive; typos fail the build with suggestions.
# trash = true makes it a thumbs-down. DIM uses the FIRST matching line, so put trash entries after the good rolls.
#
# Example:
# [[roll]]
# weapon = "Fatebringer"
# notes = "Fatebringer PvP"
# perks = [
#   ["Arrowhead Brake", "Corkscrew Rifling"],
#   ["Accurized Rounds"],
#   ["Explosive Payload"],
#   ["Firefly"],
# ]

[[roll]]
weapon = "Ancient Gospel"
notes = "PvP – MW: Range"
perks = [
  ["Smallbore", "Hammer-Forged Rifling", "Corkscrew Rifling", "Fluted Barrel"],
  ["Accurized Rounds", "Ricochet Rounds"],
  ["Lone Wolf", "Eye of the Storm"],
  ["Precision Instrument"],
]

